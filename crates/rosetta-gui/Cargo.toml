license.workspace = true
repository.workspace = true
description = "GUI for Rosetta legacy language transpiler"
keywords = ["gui", "transpiler", "egui"]
categories = ["development-tools", "gui"]

[[bin]]
name = "rosetta-gui"
path = "src/main.rs"

