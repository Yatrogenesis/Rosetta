rosetta-lisp = { workspace = true }
rosetta-quickbasic = { workspace = true }
rosetta-ml = { workspace = true }
rosetta-planner = { workspace = true }
rosetta-ops5 = { workspace = true }
rosetta-krl = { workspace = true }
rosetta-prolog = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
syntect = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
