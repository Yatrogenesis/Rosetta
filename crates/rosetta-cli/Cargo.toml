[package]
name = "rosetta-stone-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface for Rosetta transpiler"

[[bin]]
name = "rosetta"
path = "src/main.rs"

[dependencies]
rosetta-stone-core = { workspace = true }
rosetta-stone-ir = { workspace = true }
rosetta-stone-codegen = { workspace = true }
rosetta-stone-fortran = { workspace = true }
clap = { workspace = true }
clap_complete = "4.5"
colored = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Enhanced UX
indicatif = "0.17"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
walkdir = "2.5"
